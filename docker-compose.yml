version: '3.8'

services:
  # Base de datos PostgreSQL
  commercebox-db:
    image: postgres:15
    container_name: commercebox_db
    environment:
      POSTGRES_DB: ${COMMERCEBOX_DB_NAME:-commercebox}
      POSTGRES_USER: ${COMMERCEBOX_DB_USER:-commercebox_user}
      POSTGRES_PASSWORD: ${COMMERCEBOX_DB_PASSWORD:-commercebox_pass}
    volumes:
      - commercebox_postgres_data:/var/lib/postgresql/data
    # ⚠️ NO exponemos puerto al exterior (más seguro)
    expose:
      - "5432"
    restart: unless-stopped
    networks:
      - commercebox_network

  # Redis para Celery y cache
  commercebox-redis:
    image: redis:7-alpine
    container_name: commercebox_redis
    # ⚠️ NO exponemos puerto al exterior
    expose:
      - "6379"
    restart: unless-stopped
    networks:
      - commercebox_network

  # Aplicación web Django
  commercebox-web:
    build: .
    container_name: commercebox_web
    # ✅ Comando cambiado a Gunicorn
    command: gunicorn commercebox.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120
    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
      - ./logs:/app/logs
    expose:
      - "8000"
    depends_on:
      - commercebox-db
      - commercebox-redis
    environment:
      - COMMERCEBOX_DEBUG=0
      - COMMERCEBOX_DB_HOST=commercebox-db
      - COMMERCEBOX_REDIS_URL=redis://commercebox-redis:6379/0
      - COMMERCEBOX_DB_NAME=${COMMERCEBOX_DB_NAME:-commercebox}
      - COMMERCEBOX_DB_USER=${COMMERCEBOX_DB_USER:-commercebox_user}
      - COMMERCEBOX_DB_PASSWORD=${COMMERCEBOX_DB_PASSWORD:-commercebox_pass}
    restart: unless-stopped
    networks:
      - commercebox_network
      - proxy-network

  # Celery Worker
  commercebox-celery:
    build: .
    container_name: commercebox_celery
    command: celery -A commercebox worker -l info
    volumes:
      - ./logs:/app/logs
    depends_on:
      - commercebox-db
      - commercebox-redis
    environment:
      - COMMERCEBOX_DB_HOST=commercebox-db
      - COMMERCEBOX_REDIS_URL=redis://commercebox-redis:6379/0
      - COMMERCEBOX_DB_NAME=${COMMERCEBOX_DB_NAME:-commercebox}
      - COMMERCEBOX_DB_USER=${COMMERCEBOX_DB_USER:-commercebox_user}
      - COMMERCEBOX_DB_PASSWORD=${COMMERCEBOX_DB_PASSWORD:-commercebox_pass}
    restart: unless-stopped
    networks:
      - commercebox_network

  # Celery Beat
  commercebox-celery-beat:
    build: .
    container_name: commercebox_celery_beat
    command: celery -A commercebox beat -l info
    volumes:
      - ./logs:/app/logs
    depends_on:
      - commercebox-db
      - commercebox-redis
    environment:
      - COMMERCEBOX_DB_HOST=commercebox-db
      - COMMERCEBOX_REDIS_URL=redis://commercebox-redis:6379/0
      - COMMERCEBOX_DB_NAME=${COMMERCEBOX_DB_NAME:-commercebox}
      - COMMERCEBOX_DB_USER=${COMMERCEBOX_DB_USER:-commercebox_user}
      - COMMERCEBOX_DB_PASSWORD=${COMMERCEBOX_DB_PASSWORD:-commercebox_pass}
    restart: unless-stopped
    networks:
      - commercebox_network

volumes:
  commercebox_postgres_data:

networks:
  commercebox_network:
    driver: bridge
  proxy-network:
    external: true  